:root{--p:#69a081;--s:#faf8ee;--bg:#090c0a;--bd:rgba(250,248,238,.1);--cd:rgba(250,248,238,.04);box-sizing:border-box}
*{box-sizing:border-box;margin:0;padding:0}
html{overflow-x:clip;scroll-behavior:smooth;scroll-padding-top:84px;background:var(--bg);color-scheme:dark}
body{background:var(--bg);color:var(--s);font-family:'Cairo','IBM Plex Sans Arabic',sans-serif;overflow-x:clip;line-height:1.7}
a{color:inherit;text-decoration:none}button{font-family:inherit;cursor:pointer}
.hero h1,.h2,.gt,.tk span,.sc h3,.cc h4,.cg h3,.fg h5,.st b,.n{font-family:'Thmanyah Sans','Cairo','IBM Plex Sans Arabic',sans-serif}
svg{width:1.1em;height:1.1em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:1180px;margin:auto;padding:0 clamp(1rem,4vw,2rem)}
@media(min-width:1600px){.wrap{max-width:1320px}.hero h1{font-size:clamp(2.6rem,5.2vw,6.4rem)}}
.rv{opacity:0;transform:translateY(26px);transition:opacity .8s,transform .8s cubic-bezier(.2,.7,.2,1)}.rv.in{opacity:1;transform:none}
#pb{position:fixed;top:0;right:0;height:3px;background:var(--p);z-index:200;width:0;box-shadow:0 0 12px var(--p)}
#gl{position:fixed;width:520px;height:520px;margin:-260px 0 0 -260px;border-radius:50%;background:radial-gradient(circle,rgba(105,160,129,.13),transparent 65%);pointer-events:none;z-index:0;left:0;top:0;opacity:0;transition:opacity .3s}
nav{position:sticky;top:0;z-index:60;background:rgba(9,12,10,.78);backdrop-filter:blur(14px);border-bottom:1px solid var(--bd)}
.nv{display:flex;align-items:center;justify-content:space-between;gap:1rem;height:72px}
.nv img{height:42px;display:block;filter:drop-shadow(0 2px 10px rgba(105,160,129,.25))}
.ln{display:flex;gap:clamp(1rem,2.4vw,2.2rem);font-size:.95rem}.ln a{opacity:.75;transition:.2s;position:relative}.ln a:hover{opacity:1;color:var(--p)}

if(tab==='rev')b=F('كلمة صغيرة','reviewsTag')+F('عنوان القسم','reviewsTitle')+S.reviews.map((s,i)=>`<div class="cr">${F('اسم العميل','reviews.'+i+'.name')}${F('نص الرأي (اختياري)','reviews.'+i+'.text',1)}${U('صورة الرأي / لقطة الشاشة','reviews.'+i+'.img')}<button class="sm dl" data-a="del:reviews:${i}">حذف</button></div>`).join('')+'<button class="sm" data-a="add:reviews">+ إضافة رأي عميل</button>';

if(tab==='con')b=F('رقم الواتساب بالصيغة الدولية بدون + (مثال 966500000000)','contact.wa')+F('نص زر الواتساب','contact.waLabel')+F('رسالة الواتساب الجاهزة','contact.msg')+F('البريد الإلكتروني','contact.email')+F('العنوان','contact.addr')+F('ساعات العمل','contact.hours')+F('نبذة الفوتر','contact.about',1)+S.contact.social.map((s,i)=>`<div class="cr">${F('اسم المنصة','contact.social.'+i+'.n')}${F('الرابط (https://...)','contact.social.'+i+'.u')}<button class="sm dl" data-a="del:social:${i}">حذف</button></div>`).join('')+'<button class="sm" data-a="add:social">+ إضافة حساب</button>';
c.innerHTML=`<div class="tb"><b>لوحة التحكم</b>${T.map(t=>`<button data-t="${t[0]}" class="${tab===t[0]?'on':''}">${t[1]}</button>`).join('')}<button class="pub" data-a="pub">حفظ ونشر</button><button class="sm" data-a="dl" title="نزّل نسخة HTML محدثة لرفعها إلى GitHub أو أي استضافة أخرى">⭳ تنزيل الملف</button><button data-a="out">خروج</button></div><div class="msg">${note||'التعديلات تظهر مباشرة هنا، ولا تُحفظ للزوار إلا بعد الضغط على «حفظ ونشر».'}</div><div class="bdy">${b}</div>`}
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.p){set(S,t.dataset.p,t.value);site()}});
async function shrink(f,m,logo){const b=await createImageBitmap(f),k=Math.min(1,m/Math.max(b.width,b.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(b.width*k));c.height=Math.max(1,Math.round(b.height*k));const x=c.getContext('2d');x.drawImage(b,0,0,c.width,c.height);
if(logo){const d=x.getImageData(0,0,c.width,c.height),q=d.data,w=c.width,h=c.height,cr=[0,w-1,(h-1)*w,h*w-1].every(i=>q[i*4]>240&&q[i*4+1]>240&&q[i*4+2]>240);if(cr){for(let i=0;i<q.length;i+=4)q[i+3]=Math.min(255,(255-Math.min(q[i],q[i+1],q[i+2]))*2.5);x.putImageData(d,0,0)}return c.toDataURL('image/png')}
return c.toDataURL('image/jpeg',.8)}
document.addEventListener('change',async e=>{const t=e.target;try{
if(t.dataset.ck){set(S,t.dataset.ck,t.checked);return site()}

document.addEventListener('click',async e=>{
const s=e.target.closest('[data-s]');
if(s&&!e.target.closest('#cp')){const k=s.dataset.s;
if(k==='lock')return gate();if(k==='x')return cl();
if(k==='menu')return $('#ln').classList.toggle('o');if(k==='menuc')return $('#ln').classList.remove('o');
if(k==='prev'){cf--;return cfr()}if(k==='next'){cf++;return cfr()}if(k==='go'){cf=+s.dataset.i;return cfr()}
if(k==='card'){if(sw)return;const i=+s.dataset.i;if(i!==cf){cf=i;return cfr()}return lb(i)}
if(k==='doc'){e.preventDefault();const im=S.cert.img;if(im){const d=document.createElement('div');d.id='lb';d.innerHTML=`<div class="in2"><div class="hd"><b>${esc(S.cert.title)}</b><button class="ic" data-s="x">✕</button></div><img src="${esc(im)}" alt=""></div>`;document.body.appendChild(d);document.body.style.overflow='hidden'}return}}
if(e.target.id==='lb')return cl();
const t=e.target.closest('#cp [data-t],#cp [data-a]');if(!t)return;
if(t.dataset.t){tab=t.dataset.t;return panel()}
const[a,k,i,j]=t.dataset.a.split(':');
if(a==='clr'){set(S,k,'');site();panel()}
else if(a==='rm'){S.works[+k].imgs.splice(+i,1);site();panel()}
else if(a==='cover'){const m=S.works[+k].imgs;m.unshift(m.splice(+i,1)[0]);site();panel()}
else if(a==='del'){if(await ask('تأكيد الحذف؟')){(k==='social'?S.contact.social:S[k]).splice(+i,1);site();panel()}}
else if(a==='add'){const N={services:{t:'خدمة جديدة',d:'وصف الخدمة'},partners:{name:'اسم العميل',logo:''},works:{title:'مشروع جديد',cat:'مشروع عميل',link:'',imgs:[]},reviews:{name:'اسم العميل',text:'',img:''},social:{n:'منصة',u:''}};(k==='social'?S.contact.social:S[k]).push(N[k]);site();panel()}
else if(a==='out'){$('#cp').remove();document.body.style.overflow=''}
else if(a==='pub'){note='جارٍ النشر...';panel();try{const A=window.claude&&await claude.use('artifact');if(!A){dl();note='النشر التلقائي غير متاح على هذا الاستضافة، فتم تنزيل ملف index.html محدّثاً لك تلقائياً — ارفعه إلى GitHub ليحل محل الملف القديم.';return panel()}
await A.publish(buildHTML())}catch(x){note='تعذّر النشر: '+(x.code||x.message||'خطأ');panel()}}
else if(a==='dl'){dl();note='تم تنزيل نسخة index.html محدثة بكل تعديلاتك. ارفعها إلى GitHub لتحديث الموقع المباشر.';panel()}});
site();
